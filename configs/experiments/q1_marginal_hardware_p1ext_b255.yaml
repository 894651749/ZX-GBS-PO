# E3.1 对照臂 b=255（E3.1 离线标定值）：与 q1_marginal_hardware_p1ext_b256.yaml
# 逐字段一致，仅 encoder 三参数改为标定口径（标定依据见
# artifacts/e31_b_calibration/calibration.json：click 剖面 argmax=254，论文口径
# 上升段/下降段分区 → b*=255，A 区 [0,254] 共 255 模式、B 区 [255,510] 共 256 模式）。
# 按路径运行，不注册 registry。
experiment_id: Q1
features: {families: [finance_base, gbs_marginal], finance_set: extended}
readout: ridge
label_horizon: 21
search:
  param_grid:
    alpha: [0.1, 1.0, 10.0]
gbs:
  backend: cached
  namespace: hardware               # 真机命名空间：按 batch_id 只读复用
  batch_id: hw-5M-b0
  sample_store: sample_store/
  n_temporal: 511
  n_spatial: 16
  n_shots: 200000                   # 子采样语义：取批次前 200000 shots
encoder:
  n_bins_a: 255                     # A 区 bin 数 = 标定值 b*（E3.1 标定，替代论文占位 256）
  n_bins_b: 256                     # B 区 bin 数 = 511-255，合计 511 = n_temporal
  partition_boundary: 255           # B 区时间模式起点（max_b=255+256-1=510 ≤ 510 恰好通过地址预算校验）
  mapping_id: "identity"
blending:
  enabled: true                     # ρ 混合（基准为同折内 C2 口径 ridge）
  uncertainty_enabled: false
data:
  adapter: csv
  store_dir: data_store/
  start: "2023-01-03"
  end: "2025-12-31"
  pool: zz800
  market_index: "000906.SH"
  constraints_config: default       # 占位约束成本（待中信确认）
  rf_annual: 0.02                   # 占位待中信
  data_version: "zxzz800-2023-2025-v1"
rolling: {train: "1y", valid: "3m", test: "1m", purge: "5d", embargo: "2d"}  # 冻结协议 P1
