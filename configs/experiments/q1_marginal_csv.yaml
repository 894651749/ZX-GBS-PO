# Q1（真实数据×仿真GBS）：原始特征 + GBS 边际特征，检验单模式信息
experiment_id: Q1
features: [finance_base, gbs_marginal]
readout: ridge
label_horizon: 21
search:
  param_grid:
    alpha: [0.1, 1.0, 10.0]
gbs:
  backend: cached                   # 命中样本库 sim-copula-32x9-s42-n20000-eta0.7
  sample_store: sample_store/
  n_temporal: 32
  n_spatial: 9
  n_shots: 20000
  system_efficiency: 0.7
  seed: 42
encoder:
  n_bins_a: 16
  n_bins_b: 16
  partition_boundary: 16
  mapping_id: "identity"
blending:
  enabled: true                     # ρ 混合（基准为同折内 C2 口径 ridge）
  uncertainty_enabled: false
data:
  adapter: csv
  store_dir: data_store/
  start: "2023-01-03"
  end: "2025-12-31"
  pool: zz800
  market_index: "000906.SH"
  constraints_config: default       # 占位约束成本（待中信确认）
  rf_annual: 0.02                   # 占位待中信
  data_version: "zxzz800-2023-2025-v1"
rolling: {train: "2y", valid: "6m", test: "1m", purge: "5d", embargo: "2d"}
