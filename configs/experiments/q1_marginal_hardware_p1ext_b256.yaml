# E3.1 对照臂 b=256（现状占位值）：q1_marginal_hardware_p1ext.yaml 的逐字段副本，
# 仅显式列出 encoder 参数；按路径运行，不注册 registry。
# 对照臂见 q1_marginal_hardware_p1ext_b255.yaml；产物落 artifacts/e31_b_calibration/。
experiment_id: Q1
features: {families: [finance_base, gbs_marginal], finance_set: extended}
readout: ridge
label_horizon: 21
search:
  param_grid:
    alpha: [0.1, 1.0, 10.0]
gbs:
  backend: cached
  namespace: hardware               # 真机命名空间：按 batch_id 只读复用
  batch_id: hw-5M-b0
  sample_store: sample_store/
  n_temporal: 511
  n_spatial: 16
  n_shots: 200000                   # 子采样语义：取批次前 200000 shots
encoder:
  n_bins_a: 256                     # A 区 bin 数（论文值 256）
  n_bins_b: 255                     # B 区 bin 数（论文值 255），合计 511 = n_temporal
  partition_boundary: 256           # B 区时间模式起点（max_b=256+255-1=510 ≤ 510 恰好通过地址预算校验）
  mapping_id: "identity"
blending:
  enabled: true                     # ρ 混合（基准为同折内 C2 口径 ridge）
  uncertainty_enabled: false
data:
  adapter: csv
  store_dir: data_store/
  start: "2023-01-03"
  end: "2025-12-31"
  pool: zz800
  market_index: "000906.SH"
  constraints_config: default       # 占位约束成本（待中信确认）
  rf_annual: 0.02                   # 占位待中信
  data_version: "zxzz800-2023-2025-v1"
rolling: {train: "1y", valid: "3m", test: "1m", purge: "5d", embargo: "2d"}  # 冻结协议 P1
