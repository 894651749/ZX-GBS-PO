# E1.3 三池对照（pool29 派生仓，P1 协议），其余与 c3_gbm_baseline_p1y3m_csv.yaml 逐字段一致
# E1.2 滚动协议对照（P1），其余与 c3_gbm_baseline_csv.yaml 逐字段一致
# C3（真实数据）：原始金融特征 + 梯度提升树，经典非线性基线
experiment_id: C3
features: [finance_base]
readout: gbm
cov_method: ledoit_wolf
label_horizon: 21
readout_params:
  params: {max_iter: 100, max_depth: 3, learning_rate: 0.1, random_state: 42}  # sklearn HGB
search:
  param_grid:
    learning_rate: [0.05, 0.1]
blending: {enabled: false}
data:
  adapter: csv
  store_dir: data_store_derived/pool29/            # ETL 产物目录（见 data_store/MANIFEST.md）
  start: "2023-01-03"
  end: "2025-12-31"
  pool: pool29                     # 业务池（逐期重建成分，PIT 排名；口径假设待中信确认）
  market_index: "000906.SH"         # 中证800 指数作为市场因子
  constraints_config: default       # 占位约束成本（待中信确认）
  rf_annual: 0.02                   # 占位待中信：现金管理年化收益率
  data_version: "zxzz800-2023-2025-v1"
rolling: {train: "1y", valid: "3m", test: "1m", purge: "5d", embargo: "2d"}  # E1.2 协议 P1
