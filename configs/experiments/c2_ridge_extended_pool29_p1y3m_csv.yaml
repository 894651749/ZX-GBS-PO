# E1.3 三池对照（pool29 派生仓，P1 协议），其余与 c2_ridge_extended_p1y3m_csv.yaml 逐字段一致
# E1.2 滚动协议对照（P1），其余与 c2_ridge_baseline_extended_csv.yaml 逐字段一致
# C2-extended（真实数据）：扩展金融特征集（20 维）+ 岭回归
# E1.1 对照：与 c2_ridge_baseline_csv.yaml 仅 features 段不同（finance_set: extended），
# 其余逐字段一致。按路径运行，不注册 registry。
experiment_id: C2
features: {families: [finance_base], finance_set: extended}
readout: ridge
cov_method: ledoit_wolf
label_horizon: 21                   # 标签前视窗（交易日），与月度调仓对齐
search:
  param_grid:
    alpha: [0.1, 1.0, 10.0]         # ridge 正则强度小网格（valid 窗选优）
blending: {enabled: false}
data:
  adapter: csv
  store_dir: data_store_derived/pool29/            # ETL 产物目录（见 data_store/MANIFEST.md）
  start: "2023-01-03"
  end: "2025-12-31"
  pool: pool29                     # 业务池（逐期重建成分，PIT 排名；口径假设待中信确认）
  market_index: "000906.SH"         # 中证800 指数作为市场因子（extended 市场状态特征同源）
  constraints_config: default       # 占位约束成本（待中信确认）
  rf_annual: 0.02                   # 占位待中信：现金管理年化收益率
  data_version: "zxzz800-2023-2025-v1"
rolling: {train: "1y", valid: "3m", test: "1m", purge: "5d", embargo: "2d"}  # E1.2 协议 P1
