# E4.4 归因闭环节次对照：C4 确定性分位数升维的 extended_plus 版（P1 协议）
# C4（真实数据）：分位数 one-hot/显式交互，检验离散编码贡献（由 gbs/compression.py 承接）
experiment_id: C4
features: {families: [finance_base, quantile_explicit], finance_set: extended_plus}
readout: ridge
cov_method: ledoit_wolf
label_horizon: 21
quantile_explicit:
  n_bins: 5                         # 每特征分箱数
  max_interactions: 5               # 两两交互项上限（防爆维数）
search:
  param_grid:
    alpha: [0.1, 1.0, 10.0]
blending: {enabled: false}
data:
  adapter: csv
  store_dir: data_store/            # ETL 产物目录（见 data_store/MANIFEST.md）
  start: "2023-01-03"
  end: "2025-12-31"
  pool: zz800                       # 中证800 全集（2025 年末快照，非 PIT）
  market_index: "000906.SH"         # 中证800 指数作为市场因子
  constraints_config: default       # 占位约束成本（待中信确认）
  rf_annual: 0.02                   # 占位待中信：现金管理年化收益率
  data_version: "zxzz800-2023-2025-v1"
# 真实数据仅 3 年：train 2y + valid 6m 后测试期约 6 个月（方案书 §7.2 口径下限）
rolling: {train: "1y", valid: "3m", test: "1m", purge: "5d", embargo: "2d"}  # 冻结协议 P1
